name: SentryGuard
options:
  bundleIdPrefix: com.sentryguard
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"

targets:
  SentryGuard:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: SentryGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sentryguard.app
        PRODUCT_NAME: SentryGuard
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
    info:
      path: SentryGuard/Info.plist
      properties:
        CFBundleDisplayName: SentryGuard
        NSFaceIDUsageDescription: "SentryGuard uses Face ID to confirm your identity before sending any command to your vehicle."
        UILaunchScreen: {}
    entitlements:
      path: SentryGuard/App/SentryGuard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sentryguard.app
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.sentryguard.app
    dependencies:
      - target: SentryGuardWidget
        embed: true

  SentryGuardWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: SentryGuardWidget
      - path: SentryGuard/Services/TeslaModels.swift
      - path: SentryGuard/Services/KeychainService.swift
      - path: SentryGuard/Services/WidgetVehicleCache.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sentryguard.app.SentryGuardWidget
        PRODUCT_NAME: SentryGuardWidget
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_TESTABILITY: YES
        SKIP_INSTALL: YES
    info:
      path: SentryGuardWidget/Info.plist
      properties:
        CFBundleDisplayName: SentryGuard Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SentryGuardWidget/SentryGuardWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sentryguard.app
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.sentryguard.app
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  SentryGuardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: SentryGuardTests
        excludes:
          - WidgetTimelineProviderTests.swift
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sentryguard.app.tests
    dependencies:
      - target: SentryGuard

  # `SentryGuardWidget` is an app-extension product, which doesn't link into a test
  # bundle the way a normal app/framework target does (Xcode can compile a `@testable
  # import` of it, but the linker can't resolve the symbols at test-bundle build time).
  # This target sidesteps that by compiling the same widget + shared-model sources
  # directly, exactly as `SentryGuardWidget` itself does, instead of linking against it.
  SentryGuardWidgetTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: SentryGuardTests/WidgetTimelineProviderTests.swift
      - path: SentryGuardWidget/SentryGuardWidget.swift
      - path: SentryGuardWidget/Views/LockScreenWidgetView.swift
      - path: SentryGuard/Services/TeslaModels.swift
      - path: SentryGuard/Services/KeychainService.swift
      - path: SentryGuard/Services/WidgetVehicleCache.swift
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sentryguard.app.widgettests

schemes:
  SentryGuard:
    build:
      targets:
        SentryGuard: all
        SentryGuardWidget: all
        SentryGuardTests: [test]
        SentryGuardWidgetTests: [test]
    test:
      config: Debug
      targets:
        - SentryGuardTests
        - SentryGuardWidgetTests
    run:
      config: Debug
    archive:
      config: Release
